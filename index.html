<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#2563eb">
    <title>Pharmacy Yakap POS</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --success: #16a34a;
            --danger: #dc2626;
            --warning: #f59e0b;
            --bg: #f3f4f6;
            --card: #ffffff;
            --text: #1f2937;
            --border: #e5e7eb;
            --highlight-green: #10b981; /* Green for selection */
            --highlight-bg: #d1fae5;
        }

        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
            touch-action: manipulation;
        }

        .orientation-warning {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;
            padding: 20px;
        }
        .orientation-warning.show { display: flex; }
        .placeholder-text { color: #9ca3af; text-align: center; }

        .container {
            display: grid;
            grid-template-columns: 1fr 320px 350px;
            height: 100vh;
            gap: 10px;
            padding: 10px;
        }

        /* Left Panel */
        .left-panel {
            background: var(--card);
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .search-bar {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: 1px solid var(--border);
            border-radius: 6px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }

        .meds-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 10px;
            overflow-y: auto;
            flex-grow: 1;
            align-content: start;
            padding-right: 5px; /* Space for scrollbar */
        }

        .med-btn {
            background: #f9fafb;
            border: 2px solid var(--border); /* Thicker border for better visibility */
            border-radius: 8px;
            padding: 10px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
            user-select: none;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 110px; /* Fixed height */
            overflow: hidden; /* Prevent text溢出 */
            box-sizing: border-box; /* Crucial for border not cutting off */
        }

        .med-btn:active { transform: scale(0.95); }
        .med-btn:hover { background: #e0e7ff; border-color: var(--primary); }
        
        /* FIXED GREEN HIGHLIGHT */
        .med-btn.active { 
            background: var(--highlight-bg); 
            border-color: var(--highlight-green); 
            box-shadow: 0 0 0 2px var(--highlight-green); 
            z-index: 1; /* Ensure it sits on top */
        }
        
        .med-fav-icon {
            position: absolute;
            top: 5px;
            right: 5px;
            font-size: 16px;
            color: #d1d5db;
            cursor: pointer;
            z-index: 2;
        }
        .med-fav-icon.active { color: var(--warning); }

        .med-name { 
            font-weight: 600; 
            font-size: 13px; 
            line-height: 1.2; 
            margin-top: 20px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            word-wrap: break-word;
        }
        .med-details { 
            color: #6b7280; 
            font-size: 11px; 
            margin-top: 4px; 
            flex-grow: 1;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .med-price { 
            color: var(--text); 
            font-weight: bold;
            font-size: 13px; 
            margin-top: 4px; 
        }

        /* Middle Panel */
        .middle-panel {
            background: var(--card);
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .selected-info {
            background: #f9fafb;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 15px;
            min-height: 100px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            border: 1px solid var(--border);
            flex-shrink: 0;
        }

        .qty-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin: 10px 0;
            flex-shrink: 0;
        }

        .qty-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: var(--primary);
            color: white;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .qty-btn:active { transform: scale(0.9); }
        
        .qty-input {
            width: 70px;
            height: 40px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            border: 1px solid var(--border);
            border-radius: 6px;
            -moz-appearance: textfield;
        }
        .qty-input::-webkit-outer-spin-button,
        .qty-input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .numpad-wrapper {
            flex-grow: 1;
            overflow-y: auto;
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
        }

        .numpad-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .num-btn {
            background: #f3f4f6;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.1s;
            padding: 10px 0;
        }
        .num-btn:active { background: #d1d5db; transform: scale(0.95); }

        .action-btns { 
            display: flex; 
            flex-direction: column; 
            gap: 10px; 
            flex-shrink: 0; 
            margin-top: auto; 
        }
        .btn-add { background: var(--primary); color: white; padding: 12px; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .btn-add:active { background: var(--primary-hover); transform: scale(0.98); }
        .btn-clear { background: #fee2e2; color: var(--danger); padding: 10px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }

        /* Right Panel */
        .right-panel {
            background: var(--card);
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .cart-header { font-size: 16px; font-weight: bold; margin-bottom: 10px; border-bottom: 2px solid var(--border); padding-bottom: 8px;}
        .cart-items { flex-grow: 1; overflow-y: auto; margin-bottom: 15px; }
        .cart-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px dashed var(--border); font-size: 14px; }
        
        .cart-footer { border-top: 2px solid var(--text); padding-top: 10px; }
        .total-row { display: flex; justify-content: space-between; font-size: 18px; font-weight: bold; margin-bottom: 15px; }

        .btn-checkout { background: var(--success); color: white; padding: 12px; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; width: 100%; margin-bottom: 10px;}
        
        .report-container { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
        .btn-report { background: #4b5563; color: white; padding: 8px; border: none; border-radius: 6px; cursor: pointer; font-size: 12px; white-space: nowrap;}
        .btn-report:active { background: #374151; transform: scale(0.98); }
        .btn-monitor { background: #7c3aed; }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0; top: 0;
            width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.5);
            overflow: auto;
            backdrop-filter: blur(2px);
        }
        .modal-content {
            background-color: #fff;
            margin: 5% auto;
            padding: 20px;
            border-radius: 8px;
            width: 90%;
            max-width: 900px;
            max-height: 85vh;
            overflow-y: auto;
            position: relative;
            display: flex;
            flex-direction: column;
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #eee; padding-bottom: 10px; flex-shrink: 0; }
        .close-modal { color: #aaa; font-size: 28px; font-weight: bold; cursor: pointer; line-height: 1; }
        .close-modal:hover { color: #000; }
        
        .modal-body-container {
            flex-grow: 1;
            overflow-y: auto;
            margin-bottom: 15px;
        }

        .modal-actions { 
            margin-top: 10px; 
            display: flex; 
            gap: 10px; 
            justify-content: flex-end; 
            flex-shrink: 0;
            border-top: 1px solid #eee;
            padding-top: 15px;
        }
        .btn-action { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .btn-print { background: var(--primary); color: white; }
        .btn-save { background: var(--success); color: white; }
        .btn-back { background: #9ca3af; color: white; }
        .btn-delete-sm { background: #fee2e2; color: var(--danger); padding: 4px 8px; font-size: 12px; border-radius: 4px; border: none; cursor: pointer; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; font-size: 14px; }
        th { background-color: #f3f4f6; }
        .text-right { text-align: right; }
        .text-center { text-align: center; }

        @media (max-width: 1024px) and (orientation: landscape) {
            .container { grid-template-columns: 1fr 280px 300px; }
            .meds-grid { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); }
        }

        @media (max-width: 768px) and (orientation: portrait) {
            body { overflow: auto; height: auto; }
            .container { grid-template-columns: 1fr; grid-template-rows: auto auto auto; height: auto; }
            .left-panel, .middle-panel, .right-panel { min-height: 250px; margin-bottom: 10px; }
            .meds-grid { grid-template-columns: repeat(2, 1fr); max-height: 300px; }
            .numpad-grid { grid-template-columns: repeat(4, 1fr); }
            .cart-items { max-height: 200px; }
        }
    </style>
</head>
<body>

<div class="orientation-warning" id="orientationWarning">
    <div style="font-size: 60px; margin-bottom: 20px;">🔄</div>
    <h2>Please rotate your device</h2>
    <p>This system works best in landscape mode</p>
</div>

<div class="container">
    <!-- Left Panel -->
    <div class="left-panel">
        <input type="text" class="search-bar" id="searchInput" placeholder="Search medicine..." onkeyup="renderMeds()">
        <div class="meds-grid" id="medsGrid"></div>
    </div>

    <!-- Middle Panel -->
    <div class="middle-panel">
        <div class="selected-info" id="selectedInfo">
            <div class="placeholder-text">Select a medicine</div>
        </div>
        
        <div class="qty-controls" id="qtyControls" style="display:none;">
            <button class="qty-btn" onclick="adjustQty(-1)">-</button>
            <input type="number" class="qty-input" id="qtyInput" value="0" inputmode="numeric" pattern="[0-9]*">
            <button class="qty-btn" onclick="adjustQty(1)">+</button>
        </div>

        <div class="numpad-wrapper">
            <div class="numpad-grid">
                <button class="num-btn" onclick="handleNumClick(5)">5</button>
                <button class="num-btn" onclick="handleNumClick(10)">10</button>
                <button class="num-btn" onclick="handleNumClick(15)">15</button>
                <button class="num-btn" onclick="handleNumClick(20)">20</button>
                <button class="num-btn" onclick="handleNumClick(30)">30</button>
                <button class="num-btn" onclick="handleNumClick(60)">60</button>
                <button class="num-btn" onclick="handleNumClick(90)">90</button>
                <button class="num-btn" onclick="handleNumClick(120)">120</button>
                <button class="num-btn" onclick="handleNumClick(180)">180</button>
            </div>
        </div>
        
        <div class="action-btns">
            <button class="btn-add" onclick="addToCart()">ADD TO CART</button>
            <button class="btn-clear" onclick="clearSelection()">CLEAR</button>
        </div>
    </div>

    <!-- Right Panel -->
    <div class="right-panel">
        <div class="cart-header">Current Transaction</div>
        <div class="cart-items" id="cartItems">
            <div class="placeholder-text" style="margin-top:20px;">Cart is empty</div>
        </div>
        <div class="cart-footer">
            <div class="total-row">
                <span>TOTAL:</span>
                <span id="totalAmount">₱0.00</span>
            </div>
            <button class="btn-checkout" onclick="checkout()">COMPLETE TRANSACTION</button>
            <div class="report-container">
                <button class="btn-report" onclick="openReportModal('daily')">Daily Report</button>
                <button class="btn-report" onclick="openReportModal('weekly')">Weekly Report</button>
                <button class="btn-report btn-monitor" onclick="openTransactionMonitor()">Transactions</button>
            </div>
        </div>
    </div>
</div>

<!-- Modal -->
<div id="reportModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2 id="modalTitle">Report Title</h2>
            <span class="close-modal" onclick="closeModal()">&times;</span>
        </div>
        
        <!-- Separate container for scrollable content -->
        <div class="modal-body-container" id="modalBody"></div>
        
        <!-- Actions always visible at bottom -->
        <div class="modal-actions" id="modalActions">
            <!-- Buttons injected via JS -->
        </div>
    </div>
</div>

<script src="script.js"></script>
<script src="service-worker.js"></script>
</body>
</html>
