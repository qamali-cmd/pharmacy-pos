<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#2563eb">
    <title>Pharmacy POS</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --success: #16a34a;
            --danger: #dc2626;
            --bg: #f3f4f6;
            --card: #ffffff;
            --text: #1f2937;
            --border: #e5e7eb;
        }

        * { -webkit-tap-highlight-color: transparent; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
        }

        .orientation-warning {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .orientation-warning.show { display: flex; }

        .placeholder-text { color: #9ca3af; text-align: center; }

        .container {
            display: grid;
            grid-template-columns: 1fr 300px 350px;
            height: 100vh;
            gap: 10px;
            padding: 10px;
        }

        .left-panel {
            background: var(--card);
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .search-bar {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: 1px solid var(--border);
            border-radius: 6px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }

        .meds-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 10px;
            overflow-y: auto;
            flex-grow: 1;
        }

        .med-btn {
            background: #f9fafb;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 15px 10px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
            user-select: none;
        }

        .med-btn:active { transform: scale(0.95); }
        .med-btn:hover { background: #e0e7ff; border-color: var(--primary); }
        .med-btn.active { background: #dbeafe; border-color: var(--primary); box-shadow: 0 0 0 2px var(--primary); }
        .med-name { font-weight: 600; font-size: 14px; margin-bottom: 5px; }
        .med-price { color: #4b5563; font-size: 13px; }

        .middle-panel {
            background: var(--card);
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
        }

        .selected-info {
            background: #f9fafb;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 15px;
            min-height: 80px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .numpad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            flex-grow: 1;
        }

        .num-btn {
            background: #f3f4f6;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.1s;
        }

        .num-btn:active { background: #d1d5db; transform: scale(0.95); }

        .action-btns { margin-top: 15px; display: flex; flex-direction: column; gap: 10px; }
        .btn-add { background: var(--primary); color: white; padding: 15px; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; }
        .btn-add:active { background: var(--primary-hover); transform: scale(0.98); }
        .btn-clear { background: #fee2e2; color: var(--danger); padding: 10px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .btn-clear:active { transform: scale(0.98); }

        .right-panel {
            background: var(--card);
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .cart-header { font-size: 18px; font-weight: bold; margin-bottom: 10px; border-bottom: 2px solid var(--border); padding-bottom: 10px;}

        .cart-items { flex-grow: 1; overflow-y: auto; margin-bottom: 15px; }

        .cart-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px dashed var(--border);
        }
        .cart-item-name { font-weight: 500; }
        .cart-item-qty { color: #6b7280; font-size: 14px; }
        .cart-item-total { font-weight: bold; }

        .cart-footer { border-top: 2px solid var(--text); padding-top: 10px; }
        .total-row { display: flex; justify-content: space-between; font-size: 20px; font-weight: bold; margin-bottom: 15px; }

        .btn-checkout { background: var(--success); color: white; padding: 15px; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; width: 100%; margin-bottom: 10px;}
        .btn-checkout:active { background: #15803d; transform: scale(0.98); }

        .report-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .btn-report { background: #4b5563; color: white; padding: 10px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px;}
        .btn-report:active { background: #374151; transform: scale(0.98); }

        @media (max-width: 1024px) and (orientation: landscape) {
            .container { grid-template-columns: 1fr 200px 300px; padding: 5px; gap: 5px; }
            .meds-grid { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); }
            .num-btn { font-size: 18px; padding: 10px; }
        }

        @media (max-width: 768px) and (orientation: portrait) {
            body { overflow: auto; height: auto; }
            .container { grid-template-columns: 1fr; grid-template-rows: auto auto auto; height: auto; }
            .left-panel, .middle-panel, .right-panel { min-height: 250px; margin-bottom: 10px; }
            .meds-grid { grid-template-columns: repeat(2, 1fr); max-height: 300px; }
            .numpad { grid-template-columns: repeat(4, 1fr); max-height: 200px; }
            .cart-items { max-height: 200px; }
        }

        @media (min-width: 769px) and (max-width: 1024px) and (orientation: landscape) {
            .container { grid-template-columns: 1fr 250px 300px; }
        }
    </style>
</head>
<body>

<div class="orientation-warning" id="orientationWarning">
    <div style="font-size: 60px; margin-bottom: 20px;"></div>
    <h2>Please rotate your device</h2>
    <p>This system works best in landscape mode</p>
    <p style="margin-top: 20px; font-size: 14px; opacity: 0.8;">Turn your phone sideways 👉</p>
</div>

<div class="container">
    <div class="left-panel">
        <input type="text" class="search-bar" id="searchInput" placeholder="Search medicine..." onkeyup="renderMeds()">
        <div class="meds-grid" id="medsGrid"></div>
    </div>

    <div class="middle-panel">
        <div class="selected-info" id="selectedInfo">
            <div class="placeholder-text">Select a medicine</div>
        </div>
        <div class="numpad">
            <button class="num-btn" onclick="setQty(1)">1</button>
            <button class="num-btn" onclick="setQty(2)">2</button>
            <button class="num-btn" onclick="setQty(3)">3</button>
            <button class="num-btn" onclick="setQty(4)">4</button>
            <button class="num-btn" onclick="setQty(5)">5</button>
            <button class="num-btn" onclick="setQty(10)">10</button>
            <button class="num-btn" onclick="setQty(20)">20</button>
            <button class="num-btn" onclick="setQty(30)">30</button>
            <button class="num-btn" onclick="setQty(50)">50</button>
        </div>
        <div class="action-btns">
            <button class="btn-add" onclick="addToCart()">ADD TO CART</button>
            <button class="btn-clear" onclick="clearSelection()">CLEAR</button>
        </div>
    </div>

    <div class="right-panel">
        <div class="cart-header">Current Transaction</div>
        <div class="cart-items" id="cartItems">
            <div class="placeholder-text" style="margin-top:20px;">Cart is empty</div>
        </div>
        <div class="cart-footer">
            <div class="total-row">
                <span>TOTAL:</span>
                <span id="totalAmount">₱0.00</span>
            </div>
            <button class="btn-checkout" onclick="checkout()">COMPLETE TRANSACTION</button>
            <div class="report-btns">
                <button class="btn-report" onclick="printReport('daily')">DAILY REPORT</button>
                <button class="btn-report" onclick="printReport('weekly')">WEEKLY REPORT</button>
            </div>
        </div>
    </div>
</div>

<script>
    // Register Service Worker for PWA
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('service-worker.js')
            .then(reg => console.log('Service Worker registered'))
            .catch(err => console.log('Service Worker registration failed'));
    }

    function checkOrientation() {
        const warning = document.getElementById('orientationWarning');
        const isMobile = window.innerWidth <= 768;
        const isPortrait = window.innerHeight > window.innerWidth;
        
        if (isMobile && isPortrait) {
            warning.classList.add('show');
        } else {
            warning.classList.remove('show');
        }
    }

    window.addEventListener('load', checkOrientation);
    window.addEventListener('resize', checkOrientation);
    window.addEventListener('orientationchange', checkOrientation);

    let medicines = JSON.parse(localStorage.getItem('medicines')) || [
        { id: 1, name: 'Biogesic 500mg', price: 5.50 },
        { id: 2, name: 'Amoxicillin 500mg', price: 12.00 },
        { id: 3, name: 'Neozep Forte', price: 8.50 },
        { id: 4, name: 'Strepsils', price: 15.00 },
        { id: 5, name: 'Kremil-S', price: 6.00 },
        { id: 6, name: 'Vitamin C 500mg', price: 10.00 },
        { id: 7, name: 'Loperamide 2mg', price: 9.00 },
        { id: 8, name: 'Cetirizine 10mg', price: 11.00 }
    ];

    let cart = [];
    let selectedMed = null;
    let selectedQty = 0;
    let transactions = JSON.parse(localStorage.getItem('transactions')) || [];

    if (!localStorage.getItem('medicines')) {
        localStorage.setItem('medicines', JSON.stringify(medicines));
    }

    function renderMeds() {
        const grid = document.getElementById('medsGrid');
        const search = document.getElementById('searchInput').value.toLowerCase();
        grid.innerHTML = '';

        medicines.filter(m => m.name.toLowerCase().includes(search)).forEach(med => {
            const btn = document.createElement('div');
            btn.className = 'med-btn' + (selectedMed && selectedMed.id === med.id ? ' active' : '');
            btn.innerHTML = `<div class="med-name">${med.name}</div><div class="med-price">₱${med.price.toFixed(2)}</div>`;
            btn.onclick = () => selectMed(med);
            grid.appendChild(btn);
        });
    }

    function renderCart() {
        const cartDiv = document.getElementById('cartItems');
        const totalDiv = document.getElementById('totalAmount');
        
        if (cart.length === 0) {
            cartDiv.innerHTML = '<div class="placeholder-text" style="margin-top:20px;">Cart is empty</div>';
            totalDiv.innerText = '₱0.00';
            return;
        }

        cartDiv.innerHTML = '';
        let total = 0;

        cart.forEach((item, index) => {
            const itemTotal = item.price * item.qty;
            total += itemTotal;
            const div = document.createElement('div');
            div.className = 'cart-item';
            div.innerHTML = `
                <div>
                    <div class="cart-item-name">${item.name}</div>
                    <div class="cart-item-qty">Qty: ${item.qty} x ₱${item.price.toFixed(2)}</div>
                </div>
                <div style="display:flex; align-items:center; gap:10px;">
                    <div class="cart-item-total">₱${itemTotal.toFixed(2)}</div>
                    <span style="color:red; cursor:pointer; font-weight:bold;" onclick="removeFromCart(${index})">✕</span>
                </div>
            `;
            cartDiv.appendChild(div);
        });

        totalDiv.innerText = `${total.toFixed(2)}`;
    }

    function selectMed(med) {
        selectedMed = med;
        selectedQty = 0;
        document.getElementById('selectedInfo').innerHTML = `
            <div style="font-weight:bold; font-size:16px;">${med.name}</div>
            <div style="color:#4b5563; margin-top:5px;">Price: ${med.price.toFixed(2)}</div>
            <div style="margin-top:10px; font-size:24px; font-weight:bold; color:var(--primary);">Qty: ${selectedQty}</div>
        `;
        renderMeds();
    }

    function setQty(qty) {
        if (!selectedMed) {
            alert('Please select a medicine first!');
            return;
        }
        selectedQty = qty;
        document.getElementById('selectedInfo').innerHTML = `
            <div style="font-weight:bold; font-size:16px;">${selectedMed.name}</div>
            <div style="color:#4b5563; margin-top:5px;">Price: ₱${selectedMed.price.toFixed(2)}</div>
            <div style="margin-top:10px; font-size:24px; font-weight:bold; color:var(--primary);">Qty: ${selectedQty}</div>
        `;
    }

    function addToCart() {
        if (!selectedMed || selectedQty === 0) {
            alert('Please select a medicine and quantity!');
            return;
        }

        const existing = cart.find(c => c.id === selectedMed.id);
        if (existing) {
            existing.qty += selectedQty;
        } else {
            cart.push({ id: selectedMed.id, name: selectedMed.name, price: selectedMed.price, qty: selectedQty });
        }

        selectedMed = null;
        selectedQty = 0;
        document.getElementById('selectedInfo').innerHTML = '<div class="placeholder-text">Select a medicine</div>';
        renderMeds();
        renderCart();
    }

    function removeFromCart(index) {
        cart.splice(index, 1);
        renderCart();
    }

    function clearSelection() {
        selectedMed = null;
        selectedQty = 0;
        document.getElementById('selectedInfo').innerHTML = '<div class="placeholder-text">Select a medicine</div>';
        renderMeds();
    }

    function checkout() {
        if (cart.length === 0) return;
        
        const now = new Date();
        const transaction = {
            id: Date.now(),
            date: now.toISOString(),
            items: [...cart],
            total: cart.reduce((sum, item) => sum + (item.price * item.qty), 0)
        };

        transactions.push(transaction);
        localStorage.setItem('transactions', JSON.stringify(transactions));
        
        cart = [];
        renderCart();
        alert('Transaction Saved Successfully!');
    }

    function printReport(type) {
        const now = new Date();
        let filtered = [];
        let title = '';

        if (type === 'daily') {
            title = 'DAILY SUMMARY REPORT';
            filtered = transactions.filter(t => {
                const tDate = new Date(t.date);
                return tDate.toDateString() === now.toDateString();
            });
        } else if (type === 'weekly') {
            title = 'WEEKLY SUMMARY REPORT';
            const weekAgo = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000);
            filtered = transactions.filter(t => new Date(t.date) >= weekAgo);
        }

        let reportItems = {};
        filtered.forEach(t => {
            t.items.forEach(item => {
                if (!reportItems[item.name]) {
                    reportItems[item.name] = { qty: 0, total: 0, price: item.price };
                }
                reportItems[item.name].qty += item.qty;
                reportItems[item.name].total += (item.price * item.qty);
            });
        });

        let grandTotal = 0;
        let tableRows = '';
        for (let name in reportItems) {
            const r = reportItems[name];
            grandTotal += r.total;
            tableRows += `<tr>
                <td>${name}</td>
                <td style="text-align:center;">${r.qty}</td>
                <td style="text-align:right;">₱${r.price.toFixed(2)}</td>
                <td style="text-align:right;">₱${r.total.toFixed(2)}</td>
            </tr>`;
        }

        const printWindow = window.open('', '', 'height=600,width=800');
        printWindow.document.write(`
            <html><head><title>${title}</title>
            <style>
                body { font-family: Arial, sans-serif; padding: 20px; }
                h2 { text-align: center; margin-bottom: 5px; }
                p { text-align: center; color: #555; margin-top: 0;}
                table { width: 100%; border-collapse: collapse; margin-top: 20px; }
                th, td { border: 1px solid #ddd; padding: 10px; }
                th { background: #f4f4f4; }
                .total-row { font-weight: bold; font-size: 18px; text-align: right; margin-top: 20px; }
            </style></head><body>
            <h2>${title}</h2>
            <p>Generated on: ${now.toLocaleString()}</p>
            <table>
                <thead><tr><th>Medicine Name</th><th>Total Qty Dispensed</th><th>Unit Price</th><th>Total Amount</th></tr></thead>
                <tbody>${tableRows || '<tr><td colspan="4" style="text-align:center;">No transactions recorded.</td></tr>'}</tbody>
            </table>
            <div class="total-row">GRAND TOTAL: ₱${grandTotal.toFixed(2)}</div>
            <script>window.onload = function() { window.print(); }<\/script>
            </body></html>
        `);
        printWindow.document.close();
    }

    renderMeds();
    renderCart();
</script>

</body>
</html>
